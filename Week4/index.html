

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valorant Agents</title>

  <style>
    /* Desktop root font size */
    html {
      font-size: 16px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* Fixed navigation */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #263347;
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1.25rem;
      z-index: 100;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
    }

    h1 {
      text-align: center;
      margin-top: 6rem;
      font-size: 2.5rem;
    }

    /* Desktop grid: 2 columns */
    .agent-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      padding: 2rem;
    }

    /* Cards */
    .agent-card {
      display: grid;
      grid-template-rows: 2fr 1fr;
      min-height: 22rem;
      background-color: #263347;
      border-radius: 1rem;
      overflow: hidden;
    }

    .agent-image {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #176b80;
      font-size: 4rem;
    }

    .agent-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.5rem;
    }

    .agent-info h2 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
    }

    .agent-info p {
      font-size: 1rem;
      margin: 0;
    }

    /* Mobile responsive design */
    @media (max-width: 720px) {
      html {
        font-size: 12px;
      }

      nav {
        justify-content: space-evenly;
        gap: 0;
        padding: 1.5rem 0;
      }

      .agent-grid {
        grid-template-columns: 1fr;
        padding: 0;
        gap: 1rem;
      }

      .agent-card {
        min-height: 100svh;
        border-radius: 0;
      }

      h1 {
        margin-top: 7rem;
      }
    }
  </style>
</head>

<body>

  <nav>
    <a href="#home">Home</a>
    <a href="#jett">Jett</a>
    <a href="#sage">Sage</a>
    <a href="#omen">Omen</a>
  </nav>

  <h1 id="home">VALORANT AGENTS</h1>

  <div class="agent-grid">

    <div class="agent-card" id="jett">
      <div class="agent-image">⚡</div>
      <div class="agent-info">
        <h2>JETT</h2>
        <p>Role: Duelist</p>
        <p>A fast and agile agent.</p>
      </div>
    </div>

    <div class="agent-card" id="sage">
      <div class="agent-image">💚</div>
      <div class="agent-info">
        <h2>SAGE</h2>
        <p>Role: Sentinel</p>
        <p>A supportive defensive agent.</p>
      </div>
    </div>

    <div class="agent-card" id="reyna">
      <div class="agent-image">💜</div>
      <div class="agent-info">
        <h2>REYNA</h2>
        <p>Role: Duelist</p>
        <p>A powerful combat specialist.</p>
      </div>
    </div>

    <div class="agent-card" id="omen">
      <div class="agent-image">🌑</div>
      <div class="agent-info">
        <h2>OMEN</h2>
        <p>Role: Controller</p>
        <p>A mysterious shadow agent.</p>
      </div>
    </div>

  </div>

</body>
</html>
