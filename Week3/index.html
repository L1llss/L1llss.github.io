
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Japan</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #e9eff8;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 500px;
            height: 750px;
            background-color: white;
            padding: 36px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            margin: 40px auto;
            box-sizing: border-box;
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            margin-bottom: 12px;
            border-radius: 8px;
        }

        .card h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 36px;
            color: #203a60;
        }

        .card p {
            font-size: 18px;
            color: #444444;
            line-height: 1.6;
        }

        .card button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .card button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e" alt="Japan">

        <h1>Explore Japan</h1>

        <p>
            Japan is a beautiful country known for
            its rich culture, amazing food, and
            breathtaking landscapes.
        </p>

        <button onclick="window.open('https://www.japan.travel/en/', '_blank')">
            Learn More
        </button>
    </div>
</body>
</html>
